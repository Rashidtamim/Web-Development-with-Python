{% extends 'base.html' %}

{% block title %}Login{% endblock title %}

{% block content %}
<div class="auth-card">
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username_email" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>
</div>
{% endblock content %}
