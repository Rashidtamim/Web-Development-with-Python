    <!-- This is a login page  -->

   <main class="login">
    <h2 class="log">Register</h2>
    <div class="content">
      
       <label for="name"><b>Name:</b>
            <input type="name" name="name" id="" placeholder="Enter your name">

         </label> <br><br>
         <label for="dob"><b>Date of Birth:</b>
            <input type="date" name="dob" id="">
         </label> <br><br>
         <label for="email">Email:
            <input type="email" name="email" id="" placeholder="Enter Your email">

         </label><br><br>
         <label for="gender">Gender:
            <input type="radio" name="gender" id="">Male 
            <input type="radio" name="gender" id="">Female 

         </label> <br><br>
         <label for="hobbies">Your Hobbies:
            <input type="checkbox" name="hobbies" id="">Playing Cricket
            <input type="checkbox" name="hobbies" id="">Couch potato
            <input type="checkbox" name="hobbies" id="">Travelling
         </label> <br><br>
         <label for="country">Country:
            <select name="country" id="">
            <option value="">Select your country</option>
            <option value="">Bangladesh</option>
            <option value="">Canada</option>
            <option value="USA">USA</option>
            <option value="England">England</option>
            </select>
         </label>
         <br><br>

         <label for="photo">Upload Your Photo:
            <input type="file" name="photo" id="">
         </label>
<br><br>
         <label for="password">Password:
            <input type="password" name="password" id="">
         </label>

         <br> <br>
         <label for="terms">
            <input type="checkbox" name="" id=""><a href="">I agree to the terms and agreement</a>
         </label>
         <br><br>
         <label for="submit" class="register">
            <input type="submit" value="Register"></a>
            
         </label>
        

    </div>
         <p class="link1">Already have an account? <a href="login2.html">Login here</a></p>
         
   </main>
