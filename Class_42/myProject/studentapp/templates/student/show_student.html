{% extends 'base.html' %}

{% block title%}
All Student

{% endblock title%}


{% block content%}

 <section id="show" class="table-section">
        <h2>Student List</h2>

        <table>
            <thead>
                <tr>
                    
                    <th>Name</th>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Photo</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
               {% for student in students %}
               <tr>
                <td>{{ student.name}}</td>
                <td>{{ student.student_id}}</td>
                <td>{{ student.email}}</td>
               
                <td><img src="{{ student.image.url }}" width="60"></td>
                
                 <td>
                        <button class="view">View</button>
                        <button class="edit">Edit</button>
                        <button class="delete">Delete</button>
                    </td>
               </tr>
               {% endfor %}
            </tbody>

        </table>
    </section>
{% endblock content%}
