{% extends 'base.html'%}

{% block title%}
 Add_student
{% endblock title%}
 

{% block content%}
    <div class="form-container">
        <h2>Add Student</h2>

        <form method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label>Student ID</label>
                <input type="text" placeholder="Enter full name" id="id" name="id">
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter full name" id="name" name="name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" placeholder="Enter age" id="age" name="age" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select required>
                    <option value="">Select gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Course</label>
                <input type="text" placeholder="Enter course">
            </div>

            <div class="form-group">
            <label>Upload Image</label>
            <input type="file" accept="image/*" name="image" required>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>


 {% endblock content%}
