{% extends 'base.html' %}

{% block title%}
All Student

{% endblock title%}


{% block content%}

<div class="table-container">
        <h2>Student List</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <!-- Example Row -->
                <tr>
                    <td>1</td>
                    <td>John Doe</td>
                    <td>john@example.com</td>
                    <td>22</td>
                    <td>Male</td>
                    <td>Computer Science</td>
                    <td class="action-btns">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </td>
                </tr>

                <!-- More rows will come dynamically -->
            </tbody>
        </table>
    </div>




{% endblock content%}
