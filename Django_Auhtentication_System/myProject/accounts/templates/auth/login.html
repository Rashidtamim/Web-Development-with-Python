{% extends 'base.html' %}

{% block title%}
Login Page
{% endblock title%}


{% block content%}

  <!-- Login Card -->
<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-500 to-indigo-600">
  <div class="bg-white shadow-2xl rounded-lg w-full max-w-md p-8">
    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <span class="text-3xl font-bold text-blue-600">Login</span>
    </div>

    <!-- Title -->
    <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">Welcome Back</h2>

    <!-- Form -->
    <form  method="POST" class="space-y-5">
      {% csrf_token %}
      <!-- Username -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700">UserName</label>
        <input type="text" id="username" name="username" required
          class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" required
          class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <!-- Remember Me + Forgot Password -->
      <div class="flex items-center justify-between">
        <label class="flex items-center text-sm text-gray-600">
          <input type="checkbox" class="mr-2 rounded border-gray-300 focus:ring-blue-500">
          Remember me
        </label>
        <a href="#" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button
        class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-300">
        Login
      </button>
    </form>

    <!-- Divider -->
    <div class="mt-6 flex items-center justify-center">
      <span class="border-t w-1/4"></span>
      <span class="px-2 text-gray-400 text-sm">OR</span>
      <span class="border-t w-1/4"></span>
    </div>

    <!-- Social Login -->
    <div class="mt-6 flex flex-col space-y-3">
      <button class="w-full flex items-center justify-center border rounded-lg py-2 hover:bg-gray-100 transition">
        <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" class="w-5 h-5 mr-2">
        Continue with Google
      </button>
      <button class="w-full flex items-center justify-center border rounded-lg py-2 hover:bg-gray-100 transition">
        <img src="https://www.svgrepo.com/show/475656/github-color.svg" alt="GitHub" class="w-5 h-5 mr-2">
        Continue with GitHub
      </button>
    </div>

    <!-- Register Link -->
    <p class="mt-6 text-center text-sm text-gray-600">
      Don’t have an account?
      <a href="#" class="text-blue-600 hover:underline">Register</a>
    </p>
  </div>
</div>


{% endblock content %}
