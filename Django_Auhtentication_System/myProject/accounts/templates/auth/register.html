{% extends 'base.html' %}

{% block title %}
Register Page
{% endblock title %}

{% block content %}

<!-- Register Card -->
<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-500 to-indigo-600">
  <div class="bg-white shadow-2xl rounded-lg w-full max-w-md p-8">
    
    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <span class="text-3xl font-bold text-blue-600">Register</span>
    </div>

    <!-- Title -->
    <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">
      Create Your Account
    </h2>

    <!-- Form -->
    <form action="#" method="POST" class="space-y-5">
        {% csrf_token %}

      <!-- First Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">
          First Name
        </label>
        <input
          type="text"
          id="Firstname"
          name="Firstname"
          placeholder='First Name'
          required
          class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
      </div>
      <!-- Last Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">
          Last Name
        </label>
        <input
          type="text"
          id="Lastname"
          name="Lastname"
          placeholder='Last Name'
          required
          class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
      </div>
      <!-- Full Name -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">
          Full Name
        </label>
        <input
          type="text"
          id="Fullname"
          name="username"
          placeholder='Full Name'
          required
          class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">
          Email
        </label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder='Enter your email'
          required
          class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">
          Password
        </label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder='Password'
          required
          class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirm_password" class="block text-sm font-medium text-gray-700">
          Confirm Password
        </label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder='Confirm_password'
          required
          class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
      </div>

      <!-- Terms -->
      <div class="flex items-center">
        <input
          type="checkbox"
          required
          class="mr-2 rounded border-gray-300 focus:ring-blue-500"
        />
        <label class="text-sm text-gray-600">
          I agree to the
          <a href="#" class="text-blue-600 hover:underline">Terms & Conditions</a>
        </label>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-300"
      >
        Register
      </button>
    </form>

    <!-- Divider -->
    <div class="mt-6 flex items-center justify-center">
      <span class="border-t w-1/4"></span>
      <span class="px-2 text-gray-400 text-sm">OR</span>
      <span class="border-t w-1/4"></span>
    </div>

    <!-- Social Register -->
    <div class="mt-6 flex flex-col space-y-3">
      <button class="w-full flex items-center justify-center border rounded-lg py-2 hover:bg-gray-100 transition">
        <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" class="w-5 h-5 mr-2">
        Sign up with Google
      </button>
      <button class="w-full flex items-center justify-center border rounded-lg py-2 hover:bg-gray-100 transition">
        <img src="https://www.svgrepo.com/show/475656/github-color.svg" alt="GitHub" class="w-5 h-5 mr-2">
        Sign up with GitHub
      </button>
    </div>

    <!-- Login Link -->
    <p class="mt-6 text-center text-sm text-gray-600">
      Already have an account?
      <a href="#" class="text-blue-600 hover:underline">Login</a>
    </p>

  </div>
</div>

{% endblock content %}
