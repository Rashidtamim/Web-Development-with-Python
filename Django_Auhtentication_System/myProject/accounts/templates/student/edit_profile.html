{% extends 'base.html' %}

{% block title %}
Edit Profile
{% endblock title %}

{% block content %}

<div class="min-h-[80vh] flex items-center justify-center px-4">

    <form method="POST" class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg space-y-6">
        {% csrf_token %}

        <h2 class="text-2xl font-bold text-center text-gray-800">Edit Profile</h2>

        <!-- Username -->
        <div>
            <label for="username" class="block text-gray-600 mb-1 font-medium">Username</label>
            <input type="text" id="username" name="username"
                   value="{{ request.user.username }}"
                   class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>

        <!-- Email -->
        <div>
            <label for="email" class="block text-gray-600 mb-1 font-medium">Email</label>
            <input type="email" id="email" name="email"
                   value="{{ request.user.email }}"
                   class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        
        <div class="mt-6 space-y-3">
         <a href="{% url 'change_password' %}"
       class="block text-center bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition">
        Change Password
          </a>
        </div>

        <!-- Submit Button -->
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold transition">
            Update Profile
        </button>

        <!-- Cancel Button -->
        <a href="{% url 'profile' %}"
           class="block text-center text-gray-600 hover:text-gray-800 mt-2">
            Cancel
        </a>

    </form>

</div>

{% endblock content %}
